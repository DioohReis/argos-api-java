spring.application.name=argos-api-java

# O Render informa a porta pela variavel PORT; local, usa 8080
server.port=${PORT:8080}

# Conexao com o Oracle da FIAP. Usuario e senha vem SEMPRE do ambiente,
# nunca ficam escritos aqui nem no codigo.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# A conta de aluno aceita poucas sessoes ao mesmo tempo
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
# A API sobe mesmo se o banco estiver fora do ar
spring.datasource.hikari.initialization-fail-timeout=-1

# Enderecos do front liberados no CORS, separados por virgula
argos.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Erros nunca mostram stack trace nem mensagem interna
server.error.include-stacktrace=never
server.error.include-message=never
